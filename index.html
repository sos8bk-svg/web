  a.appendChild(d);a.appendChild(t);a.appendChild(el('div','go','Искать'));
  return a;
}
function group(title,items,q,top){
  out.appendChild(el('h2',null,title));
  var l=el('div','list');items.forEach(function(s){l.appendChild(row(s,q,top))});out.appendChild(l);
}

function renderChips(active){
  chipsEl.textContent='';
  CATS.forEach(function(c){
    var b=el('button','chip',c[1]);b.type='button';
    b.setAttribute('aria-pressed',String(c[0]===active));
    b.onclick=function(){manual=c[0];showAll=false;render()};
    chipsEl.appendChild(b);
  });
}

function render(){
  out.textContent='';
  var q=query.trim();
  var det=q?detect(q):null;
  var cat=manual!=='all'?manual:(det||'all');
  renderChips(cat);

  if(!q){home();return}

  if(cat!=='all'){out.appendChild(el('p','hint','Категория: '+CN[cat]+(manual==='all'?' — определили по запросу. Можно выбрать другую выше.':'.')))}
  else{out.appendChild(el('p','hint','Категорию не определили — показываем универсальные площадки. Выберите её выше, чтобы сузить выбор.'))}

  var key=cat==='all'?'x':cat;
  var ranked=S.filter(function(s){return (s.sc[key]||0)>0}).sort(function(a,b){return (b.sc[key]||0)-(a.sc[key]||0)});
  var top=ranked.slice(0,3),rest=ranked.slice(3);
  exBlock(q,cat,top);
  group('Начните отсюда',top,q,true);
  if(rest.length){
    var rr=showAll?S.filter(function(s){return top.indexOf(s)<0}):rest;
    group(showAll?'Все остальные магазины':'Ещё варианты',rr,q,false);
  }
  if(cat!=='all'&&!showAll){
    var m=el('button','more','Показать все магазины');m.type='button';
    m.onclick=function(){showAll=true;render()};out.appendChild(m);
  }
  var web=[
    ['ya','Яндекс','Найти товар по всему интернету','https://yandex.ru/search/?text=','#FC3F1D'],
    ['gg','Google','Общий поиск в интернете','https://www.google.com/search?q=','#4285F4'],
    ['yi','Яндекс Картинки','Посмотреть, как выглядит товар','https://yandex.ru/images/search?text=','#FFB400']
  ];
  group('Поиск по интернету',web,q,false);
}

var sample=null,exCache={};
try{if(window.claude&&claude.use)claude.use('sample').then(function(s){sample=s}).catch(function(){})}catch(e){}

var ICON={
lamp:'<path d="M22 14h20l6 18H16z"/><path d="M32 32v18M24 52h16"/>',
chair:'<path d="M24 8h16v22H24z"/><path d="M18 30h28v6H18zM32 36v12M20 56l12-8 12 8"/>',
shoe:'<path d="M8 44c0-6 4-8 8-8l8-14 6 4 4-2 6 10c6 2 12 4 12 10v2H8zM8 52h48"/><path d="M26 26l4 4M32 22l4 4"/>',
perfume:'<path d="M20 28h24v24H20z"/><path d="M28 20h8v8h-8zM26 10h12v10H26z"/><path d="M26 36v10"/>',
case:'<path d="M12 22h40v30H12z"/><path d="M24 22v-6h16v6M24 22v30M40 22v30M20 56v-4M44 56v-4"/>',
speaker:'<path d="M20 8h24v48H20z"/><circle cx="32" cy="22" r="5"/><circle cx="32" cy="40" r="9"/>',
cup:'<path d="M14 28h28v12a12 12 0 0 1-12 12h-4a12 12 0 0 1-12-12z"/><path d="M42 32h4a6 6 0 0 1 0 12h-4M22 12c-3 4 3 6 0 10M32 12c-3 4 3 6 0 10"/>',
blocks:'<path d="M10 36h22v18H10zM32 36h22v18H32zM21 18h22v18H21z"/>',
book:'<path d="M10 14h18a4 4 0 0 1 4 4v34a4 4 0 0 0-4-4H10zM54 14H36a4 4 0 0 0-4 4v34a4 4 0 0 1 4-4h18z"/>',
bag:'<path d="M14 24h36l-3 30H17z"/><path d="M24 24v-4a8 8 0 0 1 16 0v4"/>'};
var CI={e:'speaker',f:'shoe',b:'perfume',h:'lamp',g:'cup',c:'blocks',k:'book',s:'shoe',a:'case'};
var curCat='all';
function ico(cls,k){var d=el('span',cls);d.innerHTML='<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+ICON[k]+'</svg>';return d}
var autoPick=false;
var TILES=[['Уютный дом','плед','Пледы, свечи, лампы',35,'lamp'],['Рабочее место','эргономичное кресло','Кресла и столы',210,'chair'],['Для пробежки','беговые кроссовки','Кроссовки и часы',150,'shoe'],['Подарок маме','духи женские','Ароматы и уход',320,'perfume'],['В путешествие','чемодан','Чемоданы и рюкзаки',190,'case'],['Умный дом','умная колонка','Колонки и датчики',260,'speaker'],['Кофе дома','кофемашина','Кофемашины и кофе',25,'cup'],['Детям','конструктор','Игры и развитие',50,'blocks']];
function go(t){inp.value=t;query=t;manual='all';showAll=false;autoPick=true;render();try{window.scrollTo({top:$('f').offsetTop-8,behavior:'smooth'})}catch(e){}}
function home(){
  var TR=['кроссовки Nike','кофемашина','iPhone 15','детская коляска','зимние шины','робот-пылесос','рюкзак','наушники','плед','дрель','духи','чемодан'];
  out.appendChild(el('div','mql','Сейчас ищут'));
  var mq=el('div','mq'),tr=el('div','mqt');
  [0,1].forEach(function(k){TR.forEach(function(t){var b=el('button','chip',t);b.type='button';if(k)b.tabIndex=-1;b.onclick=function(){go(t)};tr.appendChild(b)})});
  mq.appendChild(tr);out.appendChild(mq);
  out.appendChild(el('h2',null,'Подборки для вдохновения'));
  var g=el('div','tiles');
  TILES.forEach(function(t){
    var b=el('button','tile');b.type='button';b.style.setProperty('--h',t[3]);
    b.appendChild(ico('ti',t[4]));b.appendChild(el('b',null,t[0]));b.appendChild(el('span',null,t[2]));
    b.onclick=function(){go(t[1])};g.appendChild(b);
  });
  out.appendChild(g);
  var s=el('div','sur');s.appendChild(el('p',null,'Не знаете, что искать? Пусть находка сама найдётся.'));
  var b=el('button','pick','Пусть найдётся');b.type='button';s.appendChild(b);
  var box=el('div');s.appendChild(box);out.appendChild(s);
  b.onclick=function(){
    if(!sample){box.textContent='';box.appendChild(el('p','note','Эта функция работает, когда страница открыта в Claude.'));return}
    b.disabled=true;b.textContent='Находка ищется…';box.textContent='';box.appendChild(skel(1));
    var pr='Предложи одну необычную, но полезную и реально существующую покупку, которую можно купить в России (для себя или в подарок, до 10 000 рублей). Для разнообразия учти число '+Math.random()+'. Ответь только JSON-массивом из одного объекта без пояснений и без markdown: [{"name":"точное название для поиска в магазине","why":"одна фраза, чем она хороша","price":"примерный диапазон, например: от 2 000 до 3 500 ₽"}]';
    sample.json(pr,{modelTier:'quick',cache:false}).then(function(r){
      if(!Array.isArray(r)||!r[0]||!r[0].name)throw 0;
      curCat='all';products([r[0]],S.slice(0,3),box);
    }).catch(function(e){box.textContent='';box.appendChild(el('p','note',e&&e.code==='not_granted'?'Нужно разрешить Claude подбирать находки.':'Не получилось. Попробуйте ещё раз.'))}).then(function(){b.disabled=false;b.textContent='Ещё одну находку'});
  };
}
(function(){
  var PH=['кроссовки Nike','кофемашина','детская коляска','зимние шины','iPhone 15','подарок маме'];
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  var i=0,j=0,del=false;
  function t(){
    if(document.activeElement===inp||inp.value){setTimeout(t,900);return}
    var w=PH[i];j+=del?-1:1;inp.placeholder='Например, '+w.slice(0,j);
    var d=del?35:80;
    if(!del&&j===w.length){del=true;d=1500}else if(del&&j===0){del=false;i=(i+1)%PH.length;d=350}
    setTimeout(t,d);
  }
  inp.addEventListener('focus',function(){inp.placeholder='Название товара'});
  t();
})();

function products(list,top,box){
  box.textContent='';
  list.forEach(function(p){
    var c=el('div','pr');c.appendChild(ico('ic',CI[curCat]||'bag'));c.appendChild(el('b',null,p.name));
    if(p.why)c.appendChild(el('p',null,p.why));
    if(p.price)c.appendChild(el('p','pc',p.price));
    var l=el('div','lk');
    top.forEach(function(s){var a=el('a',null,'Искать в '+s[1]);a.href=s[3]+encodeURIComponent(p.name);a.target='_blank';a.rel='noopener noreferrer';l.appendChild(a)});
    c.appendChild(l);box.appendChild(c);
  });
  box.appendChild(el('p','note','Цены — примерный ориентир, не данные магазинов. Актуальную цену и наличие смотрите по ссылке.'));
}
function exBlock(q,cat,top){
  curCat=cat;var sk=null;
  out.appendChild(el('h2',null,'Примеры товаров'));
  var box=el('div');out.appendChild(box);
  var k=cat+'|'+q.toLowerCase();
  if(exCache[k]){products(exCache[k],top,box);return}
  var b=el('button','pick','Подобрать примеры товаров');b.type='button';box.appendChild(b);if(autoPick){autoPick=false;setTimeout(function(){b.click()},0)}
  b.onclick=function(){
    if(!sample){box.appendChild(el('p','note','Подбор работает, только когда страница открыта в Claude. Поиск по магазинам ниже работает везде.'));return}
    b.disabled=true;b.textContent='Подбираю…';sk=skel(3);box.appendChild(sk);
    var pr='Ты помощник по покупкам в России. Запрос покупателя: «'+q+'»'+(cat!=='all'?' (категория: '+CN[cat]+')':'')+'. Назови 5 конкретных, реально существующих и хорошо известных в России товаров или моделей по этому запросу, разного уровня цены. Называй только то, в чём уверен, ничего не выдумывай. Ответь только JSON-массивом без пояснений и без markdown: [{"name":"точное название для поиска в магазине","why":"одна короткая фраза, чем хорош","price":"примерный диапазон, например: от 5 000 до 8 000 ₽"}]';
    sample.json(pr,{modelTier:'quick'}).then(function(r){
      if(!Array.isArray(r)||!r.length)throw 0;
      exCache[k]=r.slice(0,6).filter(function(p){return p&&p.name});products(exCache[k],top,box);
    }).catch(function(e){
      if(sk&&sk.parentNode)sk.parentNode.removeChild(sk);b.disabled=false;b.textContent='Подобрать примеры товаров';
      box.appendChild(el('p','note',e&&e.code==='not_granted'?'Нужно разрешить Claude подбирать примеры.':'Не получилось подобрать примеры. Попробуйте ещё раз или откройте магазины ниже.'));
    });
  };
}

var RED=matchMedia('(prefers-reduced-motion:reduce)').matches;
function skel(n){var d=el('div');for(var i=0;i<n;i++)d.appendChild(el('div','sk'));return d}
var SUG=[['кроссовки Nike','f'],['кроссовки беговые','s'],['куртка зимняя','f'],['джинсы мужские','f'],['рюкзак городской','f'],['iPhone 15','e'],['наушники беспроводные','e'],['ноутбук для работы','e'],['телевизор 55 дюймов','e'],['пылесос робот','e'],['смартфон Samsung','e'],['игровая видеокарта','e'],['кофемашина','h'],['плед флисовый','h'],['дрель аккумуляторная','h'],['диван угловой','h'],['матрас ортопедический','h'],['духи женские','b'],['крем для лица','b'],['шампунь','b'],['детская коляска','c'],['конструктор Lego','c'],['подгузники','c'],['зимние шины','a'],['масло моторное','a'],['велосипед горный','s'],['палатка туристическая','s'],['книга Мастер и Маргарита','k'],['витамины','p'],['кофе в зёрнах','g'],['чемодан','h']];
var sug=el('div','sug');sug.setAttribute('role','listbox');$('f').appendChild(sug);
var act=-1,items=[];
function hideSug(){sug.classList.remove('on');act=-1}
function pick(t){inp.value=t;query=t;manual='all';showAll=false;hideSug();render();try{window.scrollTo({top:$('f').offsetTop-8,behavior:'smooth'})}catch(e){}}
function showSug(){
  var v=inp.value.trim().toLowerCase();if(v.length<2){hideSug();return}
  items=SUG.filter(function(s){return s[0].toLowerCase().indexOf(v)>-1}).slice(0,5);
  if(!items.length){hideSug();return}
  sug.textContent='';act=-1;
  items.forEach(function(s){var b=el('button');b.type='button';b.appendChild(el('span',null,s[0]));b.appendChild(el('small',null,CN[s[1]]));b.addEventListener('pointerdown',function(e){e.preventDefault();pick(s[0])});sug.appendChild(b)});
  sug.classList.add('on');
}
inp.addEventListener('input',showSug);
inp.addEventListener('blur',function(){setTimeout(hideSug,120)});
inp.addEventListener('keydown',function(e){
  if(!sug.classList.contains('on'))return;var bs=sug.children;
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();act=(act+(e.key==='ArrowDown'?1:-1)+bs.length)%bs.length;for(var i=0;i<bs.length;i++)bs[i].classList.toggle('act',i===act)}
  else if(e.key==='Enter'&&act>-1){e.preventDefault();pick(items[act][0])}
  else if(e.key==='Escape')hideSug();
});
/* подсветка под курсором */
out.addEventListener('pointermove',function(e){var t=e.target.closest&&e.target.closest('.row,.pr,.tile');if(!t)return;var r=t.getBoundingClientRect();t.style.setProperty('--mx',(e.clientX-r.left)+'px');t.style.setProperty('--my',(e.clientY-r.top)+'px')});
/* плавное появление при прокрутке */
if(!RED&&'IntersectionObserver' in window){
  var io=new IntersectionObserver(function(es){var n=0;es.forEach(function(en){if(!en.isIntersecting)return;var t=en.target;io.unobserve(t);t.style.transitionDelay=(n++*70)+'ms';t.classList.add('in');setTimeout(function(){t.style.transitionDelay=''},900)})},{threshold:.08});
  new MutationObserver(function(){out.querySelectorAll('.row:not(.rv),.pr:not(.rv),.tile:not(.rv),.sur:not(.rv),h2:not(.rv)').forEach(function(t){t.classList.add('rv');io.observe(t)})}).observe(out,{childList:true,subtree:true});
}

$('f').addEventListener('submit',function(e){
  e.preventDefault();query=inp.value;showAll=false;hideSug();render();
  try{if(query.trim())window.scrollTo({top:$('f').offsetTop-8,behavior:'smooth'})}catch(x){}
});
render();
})();
</script>
